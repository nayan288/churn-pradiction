
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Data Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            min-height: 100vh;
            padding: 40px 15px;
            color: #253047;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        h2 {
            text-align: center;
            color: #3157a4;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5dbea;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            background: #fbfcff;
        }

        input:focus,
        select:focus {
            border-color: #4267c8;
            box-shadow: 0 0 5px rgba(66, 103, 200, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #3157a4;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #203e80;
        }

        .result {
            margin-top: 30px;
            padding: 22px;
            border-radius: 10px;
            background: #f3f6ff;
            border: 1px solid #dce5ff;
        }

        .result h3 {
            color: #3157a4;
            margin-bottom: 15px;
        }

        .result p {
            padding: 9px 0;
            border-bottom: 1px solid #e0e5f0;
            overflow-wrap: anywhere;
        }

        .result p:last-child {
            border-bottom: none;
        }

        @media (max-width: 550px) {
            .container {
                padding: 22px 18px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Customer Data Form</h2>
        <p class="subtitle">Enter customer information below</p>

        <form method="POST" action="/churndata">

            <div class="form-grid">

                <div class="form-group">
                    <label for="Age">Age</label>
                    <input type="number" id="Age" name="Age"
                           min="1" required>
                </div>

                <div class="form-group">
                    <label for="Tenure">Tenure</label>
                    <input type="number" id="Tenure" name="Tenure"
                           min="0" required>
                </div>

                <div class="form-group">
                    <label for="UsageFrequency">Usage Frequency</label>
                    <input type="number" id="UsageFrequency"
                           name="UsageFrequency" min="0" required>
                </div>

                <div class="form-group">
                    <label for="SupportCalls">Support Calls</label>
                    <input type="number" id="SupportCalls"
                           name="SupportCalls" min="0" required>
                </div>

                <div class="form-group">
                    <label for="PaymentDelay">Payment Delay</label>
                    <input type="number" id="PaymentDelay"
                           name="PaymentDelay" min="0" required>
                </div>

                <div class="form-group">
                    <label for="TotalSpend">Total Spend</label>
                    <input type="number" step="any" id="TotalSpend"
                           name="TotalSpend" min="0" required>
                </div>

                <div class="form-group">
                    <label for="LastInteraction">Last Interaction</label>
                    <input type="number" id="LastInteraction"
                           name="LastInteraction" min="0" required>
                </div>

                <div class="form-group">
                    <label for="new_contract_length">Contract Length</label>
                    <select id="new_contract_length"
                            name="new_contract_length" required>
                        <option value="">Select Contract Length</option>
                        <option value="0">Monthly</option>
                        <option value="1">Quarterly</option>
                        <option value="2">Annual</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="new_SubscriptionType">Subscription Type</label>
                    <select id="new_SubscriptionType"
                            name="new_SubscriptionType" required>
                        <option value="">Select Subscription Type</option>
                        <option value="0">Basic</option>
                        <option value="1">Standard</option>
                        <option value="2">Premium</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="new_Gender">Gender</label>
                    <select id="new_Gender" name="new_Gender" required>
                        <option value="">Select Gender</option>
                        <option value="0">Male</option>
                        <option value="1">Female</option>
                    </select>
                </div>

            </div>
            
            <p><strong>result:</strong> {{data}}</p>
            <button type="submit">Submit Customer Data</button>

            

            
        </form>

    </div>

</body>
</html>
